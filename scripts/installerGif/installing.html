<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Installing Downstream</title>
<style>
  /* selawik is microsoft's open stand-in for segoe ui, downstream's font on windows, fetched by render.js. */
  @font-face { font-family: 'Selawik'; font-weight: 400; src: url('../../build/installer-gif/selawk.ttf'); }
  @font-face { font-family: 'Selawik'; font-weight: 600; src: url('../../build/installer-gif/selawksb.ttf'); }

  html, body {
    margin: 0;
    width: 420px;
    height: 280px;
    overflow: hidden;
    background: #0f1923;
  }

  /* the window squirrel shows is exactly this size, with a hairline edge so it doesn't melt into a dark desktop. */
  .stage {
    position: relative;
    width: 420px;
    height: 280px;
    box-sizing: border-box;
    border: 1px solid #1d2b37;
  }

  .icon,
  .sheen {
    position: absolute;
    left: 50%;
    top: 104px;
    width: 104px;
    height: 104px;
    margin: -52px 0 0 -52px;
  }

  /* a skeleton loader's shimmer, clipped to the icon's own shape so it never touches the background. */
  .sheen {
    overflow: hidden;
    -webkit-mask: url('../../assets/icons/png/512.png') center / contain no-repeat;
    mask: url('../../assets/icons/png/512.png') center / contain no-repeat;
  }
  .band {
    position: absolute;
    top: -20%;
    bottom: -20%;
    width: 40px;
    background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.2), rgba(255,255,255,0));
    transform: skewX(-18deg);
  }

  .title {
    position: absolute;
    left: 0;
    right: 0;
    top: 180px;
    text-align: center;
    font: 600 17px 'Selawik', 'Segoe UI', sans-serif;
    letter-spacing: 0.3px;
    color: rgba(255,255,255,0.92);
  }

  .track {
    position: absolute;
    left: 50%;
    top: 219px;
    width: 168px;
    height: 4px;
    margin-left: -84px;
    border-radius: 2px;
    background: rgba(255,255,255,0.08);
    overflow: hidden;
  }

  /* a flat segment, one solid color with no fade at its ends. */
  .run {
    position: absolute;
    top: 0;
    width: 56px;
    height: 4px;
    border-radius: 2px;
    background: #4cd0c1;
  }
</style>
</head>
<body>
  <div class="stage">
    <img class="icon" src="../../assets/icons/png/512.png" alt="">
    <div class="sheen"><div class="band"></div></div>
    <div class="title">Installing Downstream</div>
    <div class="track"><div class="run"></div></div>
  </div>
<script>
  // one loop of the animation, in seconds, which render.js records frame by frame.
  const LOOP = 2.4;
  const TRACK = 168;
  const RUN = 56;
  const ICON = 104;
  const BAND = 40;
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  // the shimmer has the first part of each loop, then the bar has the rest.
  const SHIMMER = [0, 0.42];
  const SLIDE = [0.42, 1];
  const within = (p, [from, to]) => Math.min(1, Math.max(0, (p - from) / (to - from)));

  // draws the moment t seconds in, so every frame is exact and the loop joins up.
  window.frameAt = (t) => {
    const p = (t % LOOP) / LOOP;
    // the shimmer crosses the icon first, from just off its left edge to just off its right.
    document.querySelector('.band').style.left = `${-BAND * 1.5 + ease(within(p, SHIMMER)) * (ICON + BAND * 2.5)}px`;
    // then the segment glides from just off the bar's left end to just off its right.
    document.querySelector('.run').style.left = `${-RUN + ease(within(p, SLIDE)) * (TRACK + RUN)}px`;
  };

  window.LOOP = LOOP;
  window.frameAt(0);
</script>
</body>
</html>
